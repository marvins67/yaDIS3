name: yaDIS3 export validation

on:
  push:
    branches:
      - feature/redesign
  workflow_dispatch:

concurrency:
  group: export-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build yaDIS3.sln -c Release -m:1
      - name: Check formatting
        run: dotnet format yaDIS3.sln --verify-no-changes
      - name: Test
        run: dotnet test yaDIS3.sln -c Release -m:1 --no-build
